 const w=stage.clientWidth,h=stage.clientHeight,max=document.documentElement.scrollHeight-innerHeight;
 let position=clamp(scrollY/max)*projects.length;
 let index=Math.min(projects.length-1,Math.floor(position+1e-8)),p=clamp(position-index);
 // Every project has its own sailing leg and automatic arrival transition.
 if(!transition && position>=lastPosition){
  const previous=Math.min(projects.length-1,Math.floor(lastPosition+1e-8));
  if(previous<projects.length-1 && position>=previous+.63){transition={start:now,from:previous,to:previous+1,switched:false};recoil=null;}
 }
 const expandDuration=reduced.matches?0:650,holdDuration=reduced.matches?0:90,fadeDuration=reduced.matches?0:280;
 const elapsed=transition?now-transition.start:0;
 if(transition && !transition.switched && elapsed>=expandDuration+holdDuration){
  transition.switched=true;position=transition.to;scrollTo({top:max*position/projects.length,behavior:'instant'});
 }
 if(transition && elapsed>=expandDuration+holdDuration+fadeDuration){
  position=transition.to;scrollTo({top:max*position/projects.length,behavior:'instant'});transition=null;
 }
 index=transition?(transition.switched?transition.to:transition.from):Math.min(projects.length-1,Math.floor(position+1e-8));
 p=transition?(transition.switched?0:.63):clamp(position-index);
 const project=projects[index];title.textContent=project.title;description.textContent=project.description;panel.style.background=project.color;coast.setAttribute('fill',project.color);number.textContent=`0${index+1} / 0${projects.length}`;
 const leftward=index%2===1,fromX=leftward?.8:.15,toX=leftward?.2:.8;
 const shipHeight=ship.clientHeight || ship.clientWidth*1.22,edge=h*.61;
 // Start the entire image inside the panel, including its lowest pixel.
 const startY=edge-shipHeight*.5-6,toY=h*.835;
 const sailing=ease(clamp((p-.06)/.57));
 const sx=(fromX+(toX-fromX)*sailing)*w,sy=startY+(toY-startY)*sailing;
 const endpointX=toX*w,endpointY=toY;
 // The guide line shares the ship's exact start and end point, so the hull
 // always rides the line rather than drifting near it.
 route.setAttribute('d',`M ${fromX*w} ${startY} L ${endpointX} ${endpointY}`);route.style.opacity=transition?'0':'.8';
 // A small jelly-like drop clings to the panel edge as the ship first tugs
 // away, then springs free with a soft wobble. Kept short and small on
 // purpose: one little drag-and-drop, not a long trailing tail.
 const root=fromX*w,half=Math.min(18,w*.035),dragEnd=.32,maxDepth=Math.min(58,shipHeight*.85);
 const dragProgress=clamp(sailing/dragEnd),dragSailing=Math.min(sailing,dragEnd);
 const dragX=(fromX+(toX-fromX)*dragSailing)*w,dragY=startY+(toY-startY)*dragSailing;
 let depth=Math.min(maxDepth,Math.max(0,dragY-edge+shipHeight*.22)),tip=dragX;
 if(sailing<dragEnd || (recoil && recoil.index!==index))recoil=null;
 if(sailing>=dragEnd && !recoil)recoil={index,start:now,depth,tip};
 let retract=0;
 if(recoil){
  retract=clamp((now-recoil.start)/420);
  const settle=ease(retract),wobble=Math.sin(retract*Math.PI*2.4)*(1-retract)*(1-retract)*half*.5;
  depth=recoil.depth*(1-settle);tip=root+(recoil.tip-root)*(1-settle)+wobble*(1-settle);
  if(retract<1)schedule();
 }
 if(reduced.matches || transition || p<=.06)depth=0;
 const stretch=maxDepth>0?clamp(depth/maxDepth):0;
 coast.parentElement.setAttribute('viewBox',`0 0 ${w} 24`);coast.parentElement.style.top=edge+'px';
 const bulb=Math.min(half*.7,depth*.32),neck=half*(1-.7*stretch),bend=depth*.32;
 coast.setAttribute('d',depth>.4?`M0 0H${w}V0H${root+half} C${root+neck} 0 ${tip+neck} ${bend} ${tip+bulb} ${depth-bulb} C${tip+bulb*1.4} ${depth+bulb*.4} ${tip-bulb*1.4} ${depth+bulb*.4} ${tip-bulb} ${depth-bulb} C${tip-neck} ${bend} ${root-neck} 0 ${root-half} 0H0Z`:`M0 0H${w}V0H0Z`);
 ship.style.left=sx+'px';ship.style.top=sy+'px';ship.style.transform=`translate(-50%,-50%) scaleX(${leftward?-1:1}) rotate(${reduced.matches?0:Math.sin(sailing*8)*3}deg)`;
 ship.style.opacity='1';ship.style.visibility=transition||p<=.06?'hidden':'visible';
 const diameter=Math.max(100,Math.min(154,w*.12));
 const grow=transition?ease(clamp(elapsed/(expandDuration||1))):0;
 const originX=transition?(transition.from%2===1?.2:.8)*w:endpointX,originY=endpointY;
 portal.style.left=(originX+(w*.5-originX)*grow)+'px';portal.style.top=(originY+(h*.45-originY)*grow)+'px';
 portal.style.width=(diameter+(Math.hypot(w,h)*2.2-diameter)*grow)+'px';
 portal.style.opacity=transition&&transition.switched?String(1-clamp((elapsed-expandDuration-holdDuration)/(fadeDuration||1))):'1';
 cue.style.opacity=position<.06?'1':'0';end.hidden=position<projects.length-.08;lastPosition=transition?transition.to:position;
 if(transition)schedule();
}
function schedule(){if(!queued){queued=true;requestAnimationFrame(render)}}
// Prevent a continuing wheel/touch gesture from skipping the incoming project.
addEventListener('wheel',e=>{if(transition)e.preventDefault()},{passive:false});
addEventListener('touchmove',e=>{if(transition)e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if(transition&&['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(e.key))e.preventDefault()});
function closeMenu(){menu.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open project menu')}
toggle.addEventListener('click',()=>{const opening=menu.hidden;menu.hidden=!opening;toggle.setAttribute('aria-expanded',String(opening));toggle.setAttribute('aria-label',opening?'Close project menu':'Open project menu')});
function go(index){transition=null;recoil=null;lastPosition=index;closeMenu();const max=document.documentElement.scrollHeight-innerHeight;scrollTo({top:max*index/projects.length,behavior:'instant'});schedule()}
menu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.project))));document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();go(0)});end.addEventListener('click',()=>go(0));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();toggle.focus()}});addEventListener('scroll',schedule,{passive:true});addEventListener('resize',schedule);ship.addEventListener('load',schedule);reduced.addEventListener('change',schedule);render();
</script></body></html>
